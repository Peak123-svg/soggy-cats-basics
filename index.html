<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soggy Cats Basics</title>
    <style>
        /* Load your custom Comic Sans font directly from your GitHub repo */
        @font-face {
            font-family: 'ComicSans';
            src: url('https://raw.githubusercontent.com/Peak123-svg/soggy-cats-basics/main/comic-sans-ms.ttf') format('truetype');
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'ComicSans', sans-serif;
            background-color: #111;
        }

        /* Main Menu Screen */
        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: url('dfgdfgfd.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #menu h1 {
            color: #ffeb3b;
            font-size: 56px;
            text-shadow: 4px 4px #000;
            margin-bottom: 20px;
        }

        /* Menu Button Container */
        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        /* Play Button Styling */
        #play-btn {
            background: url('play.png') no-repeat center;
            background-size: contain;
            width: 220px;
            height: 90px;
            border: none;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        #play-btn:hover {
            background: url('play hover.png') no-repeat center;
            background-size: contain;
            transform: scale(1.05);
        }

        /* Settings Button Styling (Textureless) */
        #settings-btn {
            background-color: #333;
            color: #fff;
            border: 3px solid #ffeb3b;
            padding: 10px 30px;
            font-size: 20px;
            font-family: 'ComicSans', sans-serif;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            transition: background 0.2s, transform 0.1s;
        }

        #settings-btn:hover {
            background-color: #555;
            transform: scale(1.05);
        }

        /* Settings Modal Panel */
        #settings-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            border: 4px solid #ffeb3b;
            padding: 30px;
            border-radius: 12px;
            color: white;
            text-align: center;
            display: none;
            z-index: 20;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        #settings-modal h2 {
            margin-top: 0;
            color: #ffeb3b;
        }

        #settings-modal button {
            margin-top: 20px;
            background-color: #ffeb3b;
            color: #000;
            border: none;
            padding: 8px 20px;
            font-size: 16px;
            font-family: 'ComicSans', sans-serif;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }

        /* In-game HUD Counter */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            font-size: 28px;
            text-shadow: 2px 2px #000;
            display: none;
            z-index: 5;
        }

        /* Instructions overlay after clicking play */
        #instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 18px;
            text-shadow: 1px 1px #000;
            display: none;
            z-index: 5;
        }
    </style>

    <!-- Import Three.js via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- Main Menu UI -->
    <div id="menu">
        <h1>Soggy Cats Basics</h1>
        <div class="menu-buttons">
            <button id="play-btn"></button>
            <button id="settings-btn">Settings</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal">
        <h2>Settings</h2>
        <p>Mouse Sensitivity: <span id="sens-val">0.002</span></p>
        <input type="range" id="sens-slider" min="0.0005" max="0.005" step="0.0005" value="0.002">
        <br>
        <button id="close-settings">Close</button>
    </div>

    <!-- In-Game HUD -->
    <div id="hud">Sogcoins: <span id="counter">0</span> / 5</div>
    <div id="instructions">Use WASD to move, Mouse to look around. Collect all 5 Sogcoins!</div>

    <script>
        // --- SETTINGS LOGIC ---
        const settingsBtn = document.getElementById('settings-btn');
        const settingsModal = document.getElementById('settings-modal');
        const closeSettings = document.getElementById('close-settings');
        const sensSlider = document.getElementById('sens-slider');
        const sensVal = document.getElementById('sens-val');

        let mouseSensitivity = 0.002;

        settingsBtn.addEventListener('click', () => {
            settingsModal.style.display = 'block';
        });

        closeSettings.addEventListener('click', () => {
            settingsModal.style.display = 'none';
        });

        sensSlider.addEventListener('input', (e) => {
            mouseSensitivity = parseFloat(e.target.value);
            sensVal.innerText = mouseSensitivity;
        });

        // --- GAME INITIALIZATION ---
        const playButton = document.getElementById('play-btn');
        const menuDiv = document.getElementById('menu');
        const hudDiv = document.getElementById('hud');
        const instructionsDiv = document.getElementById('instructions');

        playButton.addEventListener('click', () => {
            menuDiv.style.display = 'none';
            hudDiv.style.display = 'block';
            instructionsDiv.style.display = 'block';

            document.body.requestPointerLock();
            initGame();
        });

        function initGame() {
            // 1. Scene, Camera, Renderer
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x202020);

            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 18); // Start in a hallway corridor

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 2. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.3);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            // 3. Textures
            const textureLoader = new THREE.TextureLoader();
            const floorTex = textureLoader.load('20230327_180839.png');
            const wallTex = textureLoader.load('dfgdfsafagtj.png');
            const sogcoinTex = textureLoader.load('sogcoin-texture.png');

            floorTex.wrapS = THREE.RepeatWrapping;
            floorTex.wrapT = THREE.RepeatWrapping;
            floorTex.repeat.set(10, 10);

            // 4. Build Baldi School Layout (Corridors & Rooms)
            const floorGeo = new THREE.PlaneGeometry(50, 50);
            const floorMat = new THREE.MeshStandardMaterial({ map: floorTex });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const wallMat = new THREE.MeshStandardMaterial({ map: wallTex });

            // Helper function to create school walls/dividers
            function createWall(width, height, x, y, z, rotationY = 0) {
                const wallGeo = new THREE.PlaneGeometry(width, height);
                const wall = new THREE.Mesh(wallGeo, wallMat);
                wall.position.set(x, y, z);
                wall.rotation.y = rotationY;
                scene.add(wall);
            }

            // Outer Boundary Walls (School Perimeter)
            createWall(50, 4, 0, 2, -25, 0);          // Back outer wall
            createWall(50, 4, 0, 2, 25, Math.PI);      // Front outer wall
            createWall(50, 4, -25, 2, 0, Math.PI / 2); // Left outer wall
            createWall(50, 4, 25, 2, 0, -Math.PI / 2); // Right outer wall

            // Internal Baldi-style Hallways & Classroom Dividers
            createWall(20, 4, -10, 2, -10, 0);
            createWall(20, 4, 10, 2, -5, Math.PI / 2);
            createWall(15, 4, -5, 2, 5, 0);
            createWall(15, 4, 10, 2, 10, Math.PI / 2);

            // 5. Spawn Sogcoins around the school layout
            let sogcoinsCollected = 0;
            const sogcoins = [];
            const coinGeo = new THREE.BoxGeometry(0.6, 0.8, 0.1);
            const coinMat = new THREE.MeshStandardMaterial({ map: sogcoinTex });

            const coinPositions = [
                {x: -18, z: -18},
                {x: 18, z: -18},
                {x: -18, z: 18},
                {x: 18, z: 18},
                {x: 0, z: 0}
            ];

            coinPositions.forEach(pos => {
                const coin = new THREE.Mesh(coinGeo, coinMat);
                coin.position.set(pos.x, 0.5, pos.z);
                scene.add(coin);
                sogcoins.push(coin);
            });

            // 6. Player Movement & Controls
            let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
            let yaw = 0, pitch = 0;

            window.addEventListener('keydown', (e) => {
                if (e.code === 'KeyW') moveForward = true;
                if (e.code === 'KeyS') moveBackward = true;
                if (e.code === 'KeyA') moveLeft = true;
                if (e.code === 'KeyD') moveRight = true;
            });

            window.addEventListener('keyup', (e) => {
                if (e.code === 'KeyW') moveForward = false;
                if (e.code === 'KeyS') moveBackward = false;
                if (e.code === 'KeyA') moveLeft = false;
                if (e.code === 'KeyD') moveRight = false;
            });

            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === document.body) {
                    yaw -= e.movementX * mouseSensitivity;
                    pitch -= e.movementY * mouseSensitivity;
                    pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));

                    camera.rotation.order = 'YXZ';
                    camera.rotation.y = yaw;
                    camera.rotation.x = pitch;
                }
            });

            // 7. Game Loop
            const clock = new THREE.Clock();
            function animate() {
                requestAnimationFrame(animate);

                const delta = clock.getDelta();
                const speed = 6.0 * delta;

                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                dir.y = 0;
                dir.normalize();

                const sideDir = new THREE.Vector3(-dir.z, 0, dir.x);

                if (moveForward) camera.position.addScaledVector(dir, speed);
                if (moveBackward) camera.position.addScaledVector(dir, -speed);
                if (moveRight) camera.position.addScaledVector(sideDir, speed);
                if (moveLeft) camera.position.addScaledVector(sideDir, -speed);

                // Boundary limits inside school map
                camera.position.x = Math.max(-24, Math.min(24, camera.position.x));
                camera.position.z = Math.max(-24, Math.min(24, camera.position.z));

                // Sogcoin Collection Logic
                sogcoins.forEach((coin, index) => {
                    if (coin && camera.position.distanceTo(coin.position) < 1.2) {
                        scene.remove(coin);
                        sogcoins[index] = null;
                        sogcoinsCollected++;
                        document.getElementById('counter').innerText = sogcoinsCollected;

                        if (sogcoinsCollected === 5) {
                            alert('You collected all 5 Sogcoins! You win!');
                        }
                    }
                });

                renderer.render(scene, camera);
            }
            animate();
        }

        // Window resizing support
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
