<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soggy Cats Basics</title>
    <style>
        @font-face {
            font-family: 'ComicSans';
            src: url('https://raw.githubusercontent.com/Peak123-svg/soggy-cats-basics/main/comic-sans-ms.ttf') format('truetype');
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'ComicSans', sans-serif;
            background-color: #111;
        }

        /* Main Menu */
        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: url('dfgdfgfd.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #menu h1 {
            color: #ffeb3b;
            font-size: 56px;
            text-shadow: 4px 4px #000;
            margin-bottom: 20px;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        #play-btn {
            background: url('play.png') no-repeat center;
            background-size: contain;
            width: 200px;
            height: 80px;
            border: none;
            cursor: pointer;
        }

        #play-btn:hover {
            background: url('play hover.png') no-repeat center;
            background-size: contain;
        }

        #simple-settings-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 18px;
            font-family: 'ComicSans', sans-serif;
            cursor: pointer;
            text-decoration: underline;
        }

        /* Simple Settings Panel */
        #settings-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #222;
            border: 2px solid #fff;
            padding: 20px;
            color: white;
            text-align: center;
            display: none;
            z-index: 20;
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            font-size: 28px;
            text-shadow: 2px 2px #000;
            display: none;
            z-index: 5;
        }

        #instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 16px;
            text-shadow: 1px 1px #000;
            display: none;
            z-index: 5;
        }

        /* You Can Think Math Pad UI */
        #math-pad {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #87ceeb;
            border: 6px solid #000;
            padding: 20px;
            width: 400px;
            text-align: center;
            display: none;
            z-index: 30;
            box-shadow: 5px 5px 0px #000;
        }

        #math-pad h2 {
            margin-top: 0;
            color: #000;
            background: #ffffe0;
            border: 2px solid #000;
            padding: 5px;
        }

        .math-problem {
            font-size: 22px;
            margin: 15px 0;
            font-weight: bold;
            color: #000;
        }

        #math-input {
            font-family: 'ComicSans', sans-serif;
            font-size: 20px;
            width: 80px;
            text-align: center;
            border: 2px solid #000;
        }

        #math-submit {
            font-family: 'ComicSans', sans-serif;
            font-size: 18px;
            margin-left: 10px;
            padding: 2px 10px;
            cursor: pointer;
            border: 2px solid #000;
            background: #fff;
        }

        /* 2D NPC Sprite overlay */
        #npc-sprite {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 180px;
            background: url('soggy-removebg-preview.png') no-repeat center;
            background-size: contain;
            display: none;
            z-index: 4;
            pointer-events: none;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- Main Menu -->
    <div id="menu">
        <h1>Soggy Cats Basics</h1>
        <div class="menu-buttons">
            <button id="play-btn"></button>
            <button id="simple-settings-btn">Settings: Normal Mouse</button>
        </div>
    </div>

    <!-- Simple Settings Modal -->
    <div id="settings-panel">
        <p>Toggle Mouse Mode</p>
        <button id="toggle-sens" style="font-family:'ComicSans'; padding:5px 15px; cursor:pointer;">Fast Mouse</button>
        <br><br>
        <button id="close-settings" style="font-family:'ComicSans'; padding:5px 15px; cursor:pointer;">Back</button>
    </div>

    <!-- HUD -->
    <div id="hud">Sogcoins: <span id="counter">0</span> / 8</div>
    <div id="instructions">WASD to move, Mouse to look. Collect 8 Sogcoins & find the Exit!</div>
    <div id="npc-sprite"></div>

    <!-- Math Pad UI -->
    <div id="math-pad">
        <h2>YOU CAN THINK O-PAD</h2>
        <div id="problem-container"></div>
        <input type="text" id="math-input" autocomplete="off">
        <button id="math-submit">Enter</button>
    </div>

    <script>
        let mouseSens = 0.002;

        document.getElementById('simple-settings-btn').addEventListener('click', () => {
            document.getElementById('settings-panel').style.display = 'block';
        });

        document.getElementById('close-settings').addEventListener('click', () => {
            document.getElementById('settings-panel').style.display = 'none';
        });

        document.getElementById('toggle-sens').addEventListener('click', () => {
            if(mouseSens === 0.002) {
                mouseSens = 0.004;
                document.getElementById('toggle-sens').innerText = "Hyper Mouse";
                document.getElementById('simple-settings-btn').innerText = "Settings: Hyper Mouse";
            } else {
                mouseSens = 0.002;
                document.getElementById('toggle-sens').innerText = "Normal Mouse";
                document.getElementById('simple-settings-btn').innerText = "Settings: Normal Mouse";
            }
        });

        // --- GAME SYSTEM ---
        const playButton = document.getElementById('play-btn');
        const menuDiv = document.getElementById('menu');
        const hudDiv = document.getElementById('hud');
        const instructionsDiv = document.getElementById('instructions');

        playButton.addEventListener('click', () => {
            menuDiv.style.display = 'none';
            hudDiv.style.display = 'block';
            instructionsDiv.style.display = 'block';
            document.body.requestPointerLock();
            initGame();
        });

        function initGame() {
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x303030);

            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 45);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            // Textures
            const textureLoader = new THREE.TextureLoader();
            const floorTex = textureLoader.load('20230327_180839.jpg');
            const wallTex = textureLoader.load('dfgdfsafagtj.png');
            const sogcoinTex = textureLoader.load('sogcoin-texture.png');
            const doorTex = textureLoader.load('dfgdfgfd.jpg'); // placeholder or use door texture if available

            floorTex.wrapS = THREE.RepeatWrapping;
            floorTex.wrapT = THREE.RepeatWrapping;
            floorTex.repeat.set(20, 20);

            // Big School Floor
            const floorGeo = new THREE.PlaneGeometry(120, 120);
            const floorMat = new THREE.MeshStandardMaterial({ map: floorTex });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const wallMat = new THREE.MeshStandardMaterial({ map: wallTex });

            function createWall(w, h, x, y, z, rotY = 0) {
                const geo = new THREE.PlaneGeometry(w, h);
                const wall = new THREE.Mesh(geo, wallMat);
                wall.position.set(x, y, z);
                wall.rotation.y = rotY;
                scene.add(wall);
            }

            // Big School Layout (Perimeter & Classrooms)
            createWall(120, 5, 0, 2.5, -60, 0);
            createWall(120, 5, 0, 2.5, 60, Math.PI);
            createWall(120, 5, -60, 2.5, 0, Math.PI / 2);
            createWall(120, 5, 60, 2.5, 0, -Math.PI / 2);

            // Internal maze walls (Baldi school hallways)
            createWall(40, 5, -20, 2.5, -20, 0);
            createWall(40, 5, 20, 2.5, -20, Math.PI / 2);
            createWall(50, 5, 0, 2.5, 20, 0);
            createWall(40, 5, -30, 2.5, 10, Math.PI / 2);
            createWall(40, 5, 30, 2.5, 0, 0);

            // Doors and Exit Door
            const doors = [];
            const doorGeo = new THREE.BoxGeometry(4, 4.5, 0.2);
            const doorMat = new THREE.MeshStandardMaterial({ color: 0x8b4513 }); // Brown wood door
            
            // Standard doors inside layout
            const doorPositions = [
                {x: -10, z: -20, rot: 0},
                {x: 20, z: -10, rot: Math.PI/2},
                {x: 0, z: 10, rot: 0}
            ];

            doorPositions.forEach(p => {
                const door = new THREE.Mesh(doorGeo, doorMat);
                door.position.set(p.x, 2.25, p.z);
                door.rotation.y = p.rot;
                scene.add(door);
                doors.push(door);
            });

            // Exit Door (Starts locked/closed until 8 sogcoins)
            const exitDoorMat = new THREE.MeshStandardMaterial({ color: 0x00ff00 }); // Green exit door
            const exitDoor = new THREE.Mesh(doorGeo, exitDoorMat);
            exitDoor.position.set(0, 2.25, 59.5);
            scene.add(exitDoor);

            // 8 Sogcoins placement
            let sogcoinsCollected = 0;
            const sogcoins = [];
            const coinGeo = new THREE.BoxGeometry(0.8, 1.0, 0.1);
            const coinMat = new THREE.MeshStandardMaterial({ map: sogcoinTex });

            const coinCoords = [
                {x: -50, z: -50}, {x: 50, z: -50},
                {x: -50, z: 50},  {x: 50, z: 50},
                {x: -25, z: 0},   {x: 25, z: 0},
                {x: 0, z: -40},   {x: 0, z: 40}
            ];

            coinCoords.forEach(c => {
                const coin = new THREE.Mesh(coinGeo, coinMat);
                coin.position.set(c.x, 0.6, c.z);
                scene.add(coin);
                sogcoins.push(coin);
            });

            // NPC Chaser setup
            let npcActive = false;
            let npcPos = new THREE.Vector3(0, 0, -40);
            const npcSprite = document.getElementById('npc-sprite');
            let npcSpeedMultiplier = 1.0;

            // Audio synthesis helper for custom sound effects (slap/dash noise)
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            function playDashSound(speedFactor) {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                // Pitch increases as NPC gets faster per notebook/sogcoin
                osc.frequency.setValueAtTime(120 * speedFactor, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            }

            // Math Pad UI triggers at Notebook 2 (2nd sogcoin)
            let mathPadActive = false;
            const mathPad = document.getElementById('math-pad');
            const problemContainer = document.getElementById('problem-container');
            const mathInput = document.getElementById('math-input');
            const mathSubmit = document.getElementById('math-submit');
            let currentMathQuestion = 1;

            function triggerMathPad() {
                mathPadActive = true;
                document.exitPointerLock();
                mathPad.style.display = 'block';
                currentMathQuestion = 1;
                loadMathProblem();
            }

            function loadMathProblem() {
                if (currentMathQuestion <= 2) {
                    problemContainer.innerHTML = `<div class="math-problem">Question ${currentMathQuestion}: 7 + 5 = ?</div>`;
                } else {
                    // Final impossible question requiring image/cat name typing
                    problemContainer.innerHTML = `<div class="math-problem">Q3: 987654 x 321985 / 0 = ?<br><span style="font-size:14px; color:#b00;">Type the image name (e.g., soggycat):</span></div>`;
                }
                mathInput.value = '';
                mathInput.focus();
            }

            mathSubmit.addEventListener('click', checkMathAnswer);
            mathInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') checkMathAnswer();
            });

            function checkMathAnswer() {
                const val = mathInput.value.trim().toLowerCase();
                if (currentMathQuestion <= 2) {
                    if (val === '12') {
                        currentMathQuestion++;
                        loadMathProblem();
                    } else {
                        alert('Wrong! Try again!');
                    }
                } else {
                    // Accepts any image keyword name like soggycat
                    mathPad.style.display = 'none';
                    mathPadActive = false;
                    document.body.requestPointerLock();
                }
            }

            // Controls
            let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
            let yaw = 0, pitch = 0;

            window.addEventListener('keydown', (e) => {
                if (mathPadActive) return;
                if (e.code === 'KeyW') moveForward = true;
                if (e.code === 'KeyS') moveBackward = true;
                if (e.code === 'KeyA') moveLeft = true;
                if (e.code === 'KeyD') moveRight = true;
            });

            window.addEventListener('keyup', (e) => {
                if (e.code === 'KeyW') moveForward = false;
                if (e.code === 'KeyS') moveBackward = false;
                if (e.code === 'KeyA') moveLeft = false;
                if (e.code === 'KeyD') moveRight = false;
            });

            document.addEventListener('mousemove', (e) => {
                if (mathPadActive) return;
                if (document.pointerLockElement === document.body) {
                    yaw -= e.movementX * mouseSens;
                    pitch -= e.movementY * mouseSens;
                    pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
                    camera.rotation.order = 'YXZ';
                    camera.rotation.y = yaw;
                    camera.rotation.x = pitch;
                }
            });

            // Dash sound loop ticker for NPC
            let dashTimer = 0;

            const clock = new THREE.Clock();
            function animate() {
                requestAnimationFrame(animate);

                const delta = clock.getDelta();
                if (!mathPadActive) {
                    const speed = 7.0 * delta;
                    const dir = new THREE.Vector3();
                    camera.getWorldDirection(dir);
                    dir.y = 0;
                    dir.normalize();
                    const sideDir = new THREE.Vector3(-dir.z, 0, dir.x);

                    if (moveForward) camera.position.addScaledVector(dir, speed);
                    if (moveBackward) camera.position.addScaledVector(dir, -speed);
                    if (moveRight) camera.position.addScaledVector(sideDir, speed);
                    if (moveLeft) camera.position.addScaledVector(sideDir, -speed);

                    // Map boundaries
                    camera.position.x = Math.max(-58, Math.min(58, camera.position.x));
                    camera.position.z = Math.max(-58, Math.min(58, camera.position.z));
                }

                // Sogcoins collection logic
                sogcoins.forEach((coin, index) => {
                    if (coin && camera.position.distanceTo(coin.position) < 1.5) {
                        scene.remove(coin);
                        sogcoins[index] = null;
                        sogcoinsCollected++;
                        document.getElementById('counter').innerText = sogcoinsCollected;

                        // Increase NPC speed factor with each notebook collected
                        npcSpeedMultiplier = 1.0 + (sogcoinsCollected * 0.35);

                        if (sogcoinsCollected === 2) {
                            npcActive = true;
                            npcSprite.style.display = 'block';
                            triggerMathPad();
                        }

                        if (sogcoinsCollected === 8) {
                            // Open Exit Door
                            scene.remove(exitDoor);
                            alert('escape');
                        }
                    }
                });

                // Exit Door win check
                if (sogcoinsCollected === 8 && camera.position.distanceTo(new THREE.Vector3(0, 1.6, 59)) < 2.5) {
                    alert('win');
                    location.reload();
                }

                // NPC Chasing logic
                if (npcActive && !mathPadActive) {
                    const npcTarget = new THREE.Vector3(camera.position.x, 0, camera.position.z);
                    const npcDir = new THREE.Vector3().subVectors(npcTarget, npcPos).normalize();
                    npcPos.addScaledVector(npcDir, (3.5 * npcSpeedMultiplier) * delta);

                    // Periodically trigger dash sound effect
                    dashTimer += delta;
                    if (dashTimer > (1.5 / npcSpeedMultiplier)) {
                        playDashSound(npcSpeedMultiplier);
                        dashTimer = 0;
                    }

                    // Check jumpscare catch condition
                    if (npcPos.distanceTo(npcTarget) < 1.2) {
                        alert('Caught by the Soggy Cat! Game Over.');
                        location.reload();
                    }
                }

                renderer.render(scene, camera);
            }
            animate();
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
